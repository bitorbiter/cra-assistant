# Approved checksums for fetched sources.
#
# A pin says: a human looked at these bytes and accepted them. `cra-assistant
# verify` compares the newest observation in the fetch manifest against this
# file and reports the difference.
#
# WHAT TO DO WHEN VERIFY REPORTS DRIFT depends on the source's trust tier:
#
#   trusted    Someone must look. A document we allow to influence the model's
#              behaviour changed underneath us. Read the diff, decide whether it
#              is a real amendment or page furniture, then update the checksum
#              here and say so in the note. Editing the pin IS the
#              acknowledgement, which is why `note` is required.
#
#   untrusted  Nothing to do. A forum thread changing is not an event. Drift is
#              recorded and not escalated.
#
# This file is committed; the manifest it is compared against is not.
#
# CAVEAT, and it is a large one: these digests are over RAW BYTES, so they
# include the page shell. Two EUR-Lex fetches seconds apart already differ,
# because a Dynatrace analytics tag embeds a per-request id in the markup. So a
# drift report on a trusted source here does NOT mean the legal text changed,
# and `verify` is report-only for exactly that reason. See
# docs/adr/0003-drift-policy.md.

