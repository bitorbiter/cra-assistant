name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Drift only matters on the corpus's own timescale, and fetching on every
    # push would hit EUR-Lex dozens of times a day for no signal.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        # --locked fails the build if uv.lock is out of date with pyproject.toml,
        # so CI can never silently resolve a different dependency set than a dev.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  # Everything below needs the corpus, and the corpus is not committed, so these
  # steps fetch. That makes them a network job, which must never run on a push or
  # a pull request: hitting EUR-Lex and the GitHub API dozens of times a day for
  # no signal would be rude, and an upstream outage must not fail an unrelated
  # PR (ADR-0003). One job rather than two, so the corpus is fetched once.
  corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Fetch the declared sources
        # The Actions token raises GitHub's API limit from 60 to 1,000 requests an
        # hour. Collections are paginated to completion and a fetch that hits the
        # page cap fails rather than storing a truncation (ADR-0009).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run cra-assistant fetch

      - name: Validate the segmentation
        # Fails if a structural marker stopped matching or a document arrived
        # empty — a silently truncated regulation is the worst outcome here.
        run: uv run cra-assistant validate

      - name: Evaluate retrieval
        # Report only; no threshold is justified while the golden set is
        # unverified (ADR-0007). Runs even if the drift gate below would fail,
        # so the numbers are always available.
        run: uv run cra-assistant eval --include-unverified >> "$GITHUB_STEP_SUMMARY"

      - name: Check for drift
        # Blocks on CONTENT drift for trusted sources only. Raw-byte drift is
        # expected on every EUR-Lex fetch and never fails (ADR-0003).
        run: uv run cra-assistant verify
