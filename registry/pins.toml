# Approved checksums for fetched sources.
#
# A pin says: a human looked at these bytes and accepted them. `cra-assistant
# verify` compares the newest observation in the fetch manifest against this
# file and reports the difference.
#
# WHAT TO DO WHEN VERIFY REPORTS DRIFT depends on the source's trust tier:
#
#   trusted    Someone must look. A document we allow to influence the model's
#              behaviour changed underneath us. Read the diff, decide whether it
#              is a real amendment or page furniture, then update the checksum
#              here and say so in the note. Editing the pin IS the
#              acknowledgement, which is why `note` is required.
#
#   untrusted  Nothing to do. A forum thread changing is not an event. Drift is
#              recorded and not escalated.
#
# This file is committed; the manifest it is compared against is not.
#
# TWO CHECKSUMS PER PIN, and only one of them blocks:
#
#   checksum          Digest of the raw bytes as served. REPORT-ONLY at every
#                     tier, forever. Two EUR-Lex fetches seconds apart already
#                     differ, because a Dynatrace analytics tag embeds a
#                     per-request id in the markup. This value says "the page
#                     was served again", not "the law changed".
#
#   content_checksum  Digest over the extracted segment text — the recitals,
#                     articles and annexes, without the page furniture. The two
#                     EUR-Lex responses whose raw digests differ produce the
#                     SAME content checksum. This is the one that BLOCKS CI for
#                     a trusted source.
#
# Updating content_checksum on a trusted source is a claim that you read what
# changed in the legal text and accepted it. Say what, in the note.
# See docs/adr/0003-drift-policy.md and docs/adr/0004-structure-based-segmentation.md.

