[project]
name = "cra-assistant"
description = "Retrieval over the EU Cyber Resilience Act with verifiable citations and a hard trust boundary between curated and untrusted sources."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Achim Gerhardt" }]
requires-python = ">=3.12"
dynamic = ["version"]

# Runtime dependencies are added in the step that first needs them, with a note
# in the journal saying why the stdlib was not enough. TOML parsing uses stdlib
# tomllib; pydantic earns its place by validating the registry declaratively.
dependencies = [
    "httpx>=0.27",
    "openai>=1.50",
    "pydantic>=2.9",
]

[project.scripts]
cra-assistant = "cra_assistant.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Single source of truth for the version: the package itself.
path = "src/cra_assistant/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cra_assistant"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting (replaces isort)
    "UP",  # pyupgrade: keep to modern 3.12 idioms
    "B",   # flake8-bugbear: likely bugs
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests are deselected by default; `pytest -m live` overrides the -m here.
addopts = "-ra --strict-markers --strict-config -m 'not live'"
markers = [
    "live: calls the OpenAI API. Needs OPENAI_API_KEY and CRA_LIVE_TESTS=1, costs money.",
]
