# Golden set for retrieval and generation evaluation.
#
# Committed data, reviewed in pull requests, validated through pydantic exactly
# like registry/sources.toml. A change to a gold label is a change to what
# "correct" means, and it should be as visible in a diff as a change to a
# trusted source is.
#
# STATUS: every item below was DRAFTED, not verified. `verified = false` means
# nobody has checked by hand that the expected segment ids actually answer the
# question. `cra-assistant eval` refuses to score unverified items unless
# --include-unverified is passed, and says so in the report header.
#
# Fields
#   id                    stable identifier, referenced by reports over time
#   question              exactly as it would be asked
#   lang                  the language the question is asked in
#   vocabulary            statute      = the regulation's own wording
#                         practitioner = how somebody with the problem asks
#   answer_type           answerable      = the trusted corpus answers it
#                         unanswerable    = nothing in the corpus answers it;
#                                           abstention is the correct outcome
#                         untrusted_only  = only an untrusted source answers it
#   expected_segment_ids  gold labels. Empty for unanswerable. Stable across
#                         corrigenda by ADR-0005, which is what makes this set
#                         durable.
#   note                  why this item exists, and any doubt about the label
#   verified              a human has checked the label by hand

# =============================================================================
# ANSWERABLE FROM THE TRUSTED CORPUS (25)
# =============================================================================

