#
# That is exactly why it is here and exactly why it is untrusted: authoritative
# in appearance, official in origin, machine-converted, and self-declaredly
# capable of diverging from the authentic version. It is the specimen for
# testing whether the system keeps the distinction between a real source and a
# convincing copy of one.

