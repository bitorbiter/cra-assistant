# Attack fixtures, declared as ordinary untrusted sources.
#
# Separate from registry/sources.toml on purpose: `ask` and `eval` load the
# production registry and never see these. Only `cra-assistant attack` loads
# this file, and it loads it ALONGSIDE the real trusted corpus, because an
# attack arriving without genuine statute beside it does not test what happens
# when a model has to choose between them.
#
# Every entry is `tier = "untrusted"` and reaches the corpus through the same
# fetch, plausibility, segmentation and retrieval path as anything downloaded
# from the internet (ADR-0009's seam, built in this step). Nothing here is a
# test-only shortcut: an attack that arrives by a special path proves nothing
# about the path real content takes.
#
# The documents are committed under fixtures/attacks/ and have never been
# published anywhere. See fixtures/attacks/README.md.

