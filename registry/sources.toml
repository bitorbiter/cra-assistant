# Corpus source registry.
#
# This file is data, not configuration for a program to interpret loosely. Every
# entry is validated by cra_assistant.registry.load_registry, and anything it
# cannot validate is an error rather than a default.
#
# The `tier` field is the trust boundary of the whole system, and it describes
# WRITE ACCESS, NOT QUALITY:
#
#   trusted    curated, writable only by authorised parties; may carry
#              instruction authority in prompts
#   untrusted  writable by anyone; encapsulated, never treated as instructions,
#              never permitted to trigger tool calls
#
# A source that would contain both tiers is two sources. Adding a source with
# tier = "trusted" is a security-relevant change and should be reviewed as one.
#
# Fields describe what a source IS. Facts about a particular download —
# checksum, retrieval time, byte count — belong in the fetch manifest, not here.
# Adding such a key to an entry will fail validation.
#
# All URLs below were fetched and returned 200 on 2026-09-12.
#
# Version scope: this registry declares the Official Journal text of 20.11.2024.
# Corrigenda 32024R2847R(01) and 32024R2847R(04) amend the article text and are
# NOT yet handled — neither fetched nor reconciled against the OJ version. Any
# answer citing an article amended by a corrigendum is therefore citing
# superseded wording. Handling them means deciding whether a corrigendum is a
# separate source or a patch applied to one, which is not yet decided.


