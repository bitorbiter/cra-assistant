name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Drift only matters on the corpus's own timescale, and fetching on every
    # push would hit EUR-Lex dozens of times a day for no signal.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        # --locked fails the build if uv.lock is out of date with pyproject.toml,
        # so CI can never silently resolve a different dependency set than a dev.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  # Retrieval evaluation is offline: it needs the corpus but no API key and no
  # network, so it can run on every push. It REPORTS ONLY — no threshold is
  # justified before a baseline exists, and the gate arrives in a later step
  # (ADR-0007). The corpus is not committed, so this job fetches it.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Fetch the corpus
        run: uv run cra-assistant fetch

      - name: Evaluate retrieval
        # --include-unverified while the golden set is still drafted. Remove it
        # once the labels have been checked by hand; the report header tracks
        # which mode produced the numbers.
        run: uv run cra-assistant eval --include-unverified >> "$GITHUB_STEP_SUMMARY"

  # Drift detection needs the corpus, and the corpus is not committed, so this
  # job fetches. It is separate from `check` precisely so that a network failure
  # or an upstream edit can never block an unrelated pull request.
  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Fetch the declared sources
        run: uv run cra-assistant fetch

      - name: Validate the segmentation
        # Fails if a structural marker stopped matching — a silently truncated
        # regulation is the worst outcome for a citation system.
        run: uv run cra-assistant validate

      - name: Check for drift
        # Blocks on CONTENT drift for trusted sources only. Raw-byte drift is
        # expected on every EUR-Lex fetch and never fails. See ADR-0003.
        run: uv run cra-assistant verify
