#
# Community interpretation of the CRA. Useful precisely because it argues about
# what the text means in practice, and untrusted precisely because anyone can
# open a pull request or post a reply.
#
# NONE OF THESE IS A RENDERED HTML PAGE, and that is a rule, not a coincidence
# (ADR-0009). github.com serves its issue lists and discussion threads as an
# application shell that fills itself in from the browser; a static fetch of one
# returns a navigation menu and the words "Uh oh! There was an error while
# loading." Three sources in this file used to be exactly that, checksummed and
# pinned and reported clean. Untrusted content now comes from APIs and raw
# files, and every document must pass an ingest plausibility check.

